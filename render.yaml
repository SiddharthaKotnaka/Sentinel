services:
  # ---------------------------------------------------------------------------
  # 1. FastAPI Backend Web Service (Render Free Tier)
  # Ephemeral storage, zero proprietary AI API keys, built-in deterministic fallback
  # ---------------------------------------------------------------------------
  - type: web
    name: sentinel-backend
    runtime: docker
    dockerfilePath: ./docker/backend.Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: BACKEND_HOST
        value: 0.0.0.0
      - key: LLM_PROVIDER
        value: mock # Built-in non-network deterministic provider for zero-cost operation
      - key: STORAGE_BASE_DIR
        value: /app/storage
      - key: DATABASE_URL
        value: sqlite:////app/storage/sentinel.db
      - key: BACKEND_CORS_ORIGINS
        fromService:
          type: web
          name: sentinel-frontend
          envVarKey: RENDER_EXTERNAL_URL

  # ---------------------------------------------------------------------------
  # 2. Next.js Frontend Dashboard (Render Free Tier)
  # ---------------------------------------------------------------------------
  - type: web
    name: sentinel-frontend
    runtime: node
    rootDir: frontend
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: sentinel-backend
          envVarKey: RENDER_EXTERNAL_URL
